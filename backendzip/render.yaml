# Render blueprint. Deploy with: Render dashboard > New > Blueprint.
services:
  - type: web
    name: knowledgepulse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    disk:
      name: kp-data          # Chroma is file-backed and needs to survive restarts
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false          # set this in the dashboard, not in the repo
      - key: DATABASE_URL
        sync: false          # your Neon connection string
      - key: CORS_ORIGINS
        sync: false          # your Netlify URL
