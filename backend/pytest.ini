[pytest]
# The layered suites. tests/test_multitenancy.py is a standalone unittest file
# (it configures its own database) and is run separately by run-tests.
testpaths = tests/suites
addopts = -ra --strict-markers -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning
